<!DOCTYPE html>
<html lang="kk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ұлы Дала жолы</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=PT+Serif:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root { --dark:#2a1703; --brown:#412402; --brown2:#633806; --gold:#EF9F27; --gold2:#FAC775; --bronze:#BA7517; --paper:#FAEEDA; --paper2:#f3dfbb; --green:#639922; --green2:#27500A; --red:#c2412f; }
  * { box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }
  html, body { min-height:100%; }
  body { background:var(--dark); color:var(--paper); font-family:-apple-system,"Segoe UI",Roboto,sans-serif; user-select:none; -webkit-user-select:none;
    padding:calc(env(safe-area-inset-top) + 12px) 14px calc(env(safe-area-inset-bottom) + 16px); display:flex; justify-content:center; }
  .app { width:100%; max-width:480px; }
  .serif { font-family:"PT Serif", Georgia, serif; }
  .screen { display:none; flex-direction:column; align-items:center; text-align:center; animation:fade .4s; }
  .screen.on { display:flex; }
  @keyframes fade { from { opacity:0; transform:translateY(8px); } to { opacity:1; transform:none; } }
  .frame { width:100%; background:var(--brown); border:3px solid var(--bronze); border-radius:22px; padding:16px; position:relative; }
  .orn { display:block; width:100%; height:22px; }
  h1 { font-family:"PT Serif",serif; font-weight:700; color:var(--gold2); font-size:34px; line-height:1.15; margin:6px 0; }
  h2 { font-family:"PT Serif",serif; font-weight:700; color:var(--gold2); font-size:24px; margin:4px 0 8px; }
  .lead { color:var(--paper); font-size:17px; line-height:1.55; margin:10px 4px 16px; opacity:.92; }
  .btn { font-family:"PT Serif",serif; font-size:21px; font-weight:700; color:var(--brown); background:var(--gold); border:0; border-radius:16px; padding:14px 40px; box-shadow:0 5px 0 #854F0B; margin-top:8px; cursor:pointer; }
  .btn:active { transform:translateY(3px); box-shadow:0 2px 0 #854F0B; }
  .btn.ghost { background:transparent; color:var(--gold2); border:2px solid var(--bronze); box-shadow:none; font-size:17px; padding:10px 24px; }
  .name-in { width:100%; font-size:19px; padding:14px 16px; border-radius:14px; border:2px solid var(--bronze); background:var(--paper); color:var(--brown); font-family:"PT Serif",serif; text-align:center; outline:none; margin-top:4px; -webkit-user-select:text; user-select:text; }
  .name-in:focus { border-color:var(--gold); }
  .err { color:#f09595; font-size:14px; min-height:20px; margin-top:6px; }
  .emblem { width:120px; height:120px; margin:8px auto 0; }

  .bar { display:flex; justify-content:space-between; align-items:center; width:100%; color:var(--gold2); font-size:15px; font-weight:600; padding:2px 4px 10px; }
  .bar .coins::before { content:""; display:inline-block; width:14px; height:14px; border-radius:50%; background:var(--gold); border:2px solid #854F0B; margin-right:6px; vertical-align:-2px; }

  .map { width:100%; background:var(--paper); border-radius:14px; display:block; }
  .node { cursor:pointer; }
  .node.locked { cursor:default; }
  .node.cur circle.ring { animation:pulse 1.6s infinite; transform-origin:center; transform-box:fill-box; }
  @keyframes pulse { 0%,100% { transform:scale(1); opacity:.9; } 50% { transform:scale(1.35); opacity:0; } }
  .hint { color:var(--gold2); font-size:15px; margin-top:12px; min-height:22px; }

  .dots { display:flex; gap:8px; justify-content:center; margin-bottom:12px; }
  .dot { width:12px; height:12px; border-radius:50%; background:#5a3a14; border:1px solid var(--bronze); }
  .dot.ok { background:var(--green); } .dot.bad { background:var(--red); } .dot.now { background:var(--gold); }
  .qcard { background:var(--paper); color:var(--brown); border-radius:16px; padding:18px 14px; margin-bottom:14px; outline:2px dashed var(--bronze); outline-offset:-8px; }
  .qcity { font-size:13px; color:var(--brown2); letter-spacing:.5px; margin-bottom:6px; }
  .q { font-family:"PT Serif",serif; font-size:21px; line-height:1.4; font-weight:700; }
  .opts { display:grid; grid-template-columns:1fr; gap:10px; width:100%; }
  .opt { font-size:18px; font-weight:600; text-align:left; padding:14px 16px; border-radius:14px; border:2px solid var(--bronze); background:#55320b; color:var(--paper); cursor:pointer; display:flex; gap:12px; align-items:center; }
  .opt b { font-family:"PT Serif",serif; color:var(--gold); min-width:18px; }
  .opt.ok { background:var(--green); border-color:#97C459; color:#fff; animation:pop .35s; }
  .opt.ok b, .opt.bad b { color:#fff; }
  .opt.bad { background:var(--red); border-color:#f09595; color:#fff; animation:shake .35s; }
  @keyframes pop { 50% { transform:scale(1.04); } }
  @keyframes shake { 25% { transform:translateX(-6px); } 75% { transform:translateX(6px); } }
  .msg { min-height:30px; margin-top:12px; font-family:"PT Serif",serif; font-size:20px; font-weight:700; }

  .fact { background:var(--paper); color:var(--brown); border-radius:14px; padding:14px; font-size:16px; line-height:1.55; margin:6px 0 14px; text-align:left; }
  .cert { background:var(--paper); color:var(--brown); border-radius:14px; padding:20px 14px; margin:8px 0 14px; border:3px double var(--bronze); }
  .cert h2 { color:var(--brown2); }
  .stars { font-size:40px; color:var(--gold); letter-spacing:6px; }
</style>
</head>
<body>
<div class="app">

  <!-- START -->
  <section id="s-start" class="screen on">
    <div class="frame">
      <svg class="orn" data-orn></svg>
      <svg class="emblem" viewBox="0 0 120 120" aria-hidden="true">
        <circle cx="60" cy="60" r="56" fill="none" stroke="#BA7517" stroke-width="3"/>
        <circle cx="60" cy="60" r="46" fill="#2a1703" stroke="#EF9F27" stroke-width="2"/>
        <g stroke="#EF9F27" stroke-width="2" fill="none">
          <circle cx="60" cy="60" r="20"/>
          <path d="M60 40 V80 M40 60 H80 M46 46 L74 74 M74 46 L46 74"/>
        </g>
        <circle cx="60" cy="60" r="6" fill="#EF9F27"/>
        <g fill="#FAC775"><circle cx="60" cy="10" r="3"/><circle cx="60" cy="110" r="3"/><circle cx="10" cy="60" r="3"/><circle cx="110" cy="60" r="3"/></g>
      </svg>
      <h1>Ұлы Дала жолы</h1>
      <p class="lead">Отырардан Астанаға дейін тарихи сапарға шық! Әр қалада 5 сұрақ бар. Дұрыс жауап беріп, келесі қаланың жолын аш.</p>
      <input class="name-in" id="name" maxlength="30" placeholder="Атыңды жаз" autocomplete="off">
      <div class="err" id="name-err"></div>
      <button class="btn" id="b-start">Сапарды бастау</button>
      <svg class="orn" data-orn style="margin-top:14px;transform:scaleY(-1)"></svg>
    </div>
  </section>

  <!-- MAP -->
  <section id="s-map" class="screen">
    <div class="frame">
      <div class="bar"><span class="serif">Ұлы Дала жолы</span><span class="coins" id="m-coins">0</span></div>
      <svg class="map" id="map" viewBox="0 0 340 420"></svg>
      <div class="hint" id="m-hint"></div>
    </div>
  </section>

  <!-- CITY INTRO -->
  <section id="s-intro" class="screen">
    <div class="frame">
      <svg class="orn" data-orn></svg>
      <p class="qcity" style="color:var(--gold2);margin-top:8px" id="i-level"></p>
      <h1 id="i-city"></h1>
      <div class="fact" id="i-fact"></div>
      <button class="btn" id="b-go">Сынақты бастау</button><br>
      <button class="btn ghost" id="b-back" style="margin-top:12px">Картаға қайту</button>
    </div>
  </section>

  <!-- QUIZ -->
  <section id="s-quiz" class="screen">
    <div class="frame">
      <div class="bar"><span id="q-lives"></span><span class="coins" id="q-coins">0</span></div>
      <div class="dots" id="q-dots"></div>
      <div class="qcard"><div class="qcity" id="q-city"></div><div class="q" id="q-text"></div></div>
      <div class="opts" id="q-opts"></div>
      <div class="msg" id="q-msg"></div>
    </div>
  </section>

  <!-- RESULT -->
  <section id="s-result" class="screen">
    <div class="frame">
      <svg class="orn" data-orn></svg>
      <h1 id="r-title"></h1>
      <div class="stars" id="r-stars"></div>
      <p class="lead" id="r-text"></p>
      <button class="btn" id="r-btn"></button>
    </div>
  </section>

  <!-- FINAL -->
  <section id="s-final" class="screen">
    <div class="frame">
      <svg class="orn" data-orn></svg>
      <div class="cert">
        <p class="qcity">Құрмет грамотасы</p>
        <h2>Ұлы Дала батыры</h2>
        <p class="serif" id="f-name" style="font-size:24px;font-weight:700;color:var(--brown);margin:2px 0 8px"></p>
        <p style="font-size:16px;line-height:1.55">Сен Отырардан Астанаға дейінгі тарихи жолдан сүрінбей өттің! Ата тарихын білетін нағыз батырсың.</p>
        <div class="stars" id="f-stars" style="margin-top:8px"></div>
        <p style="margin-top:6px;font-weight:700" id="f-coins"></p>
      </div>
      <button class="btn" id="b-restart">Жаңадан бастау</button>
      <svg class="orn" data-orn style="margin-top:14px;transform:scaleY(-1)"></svg>
    </div>
  </section>

</div>

<script>
const LEVELS = [
  { city:'Отырар', pos:[70,335], fact:'Отырар — Сырдария бойындағы ежелгі қала. Мұнда «Екінші ұстаз» атанған ұлы ғалым Әл-Фараби дүниеге келген. 1219–1220 жылдары қала Шыңғыс хан әскеріне қарсы ерлікпен қорғанған.',
    qs:[
      ['«Екінші ұстаз» атанған отырарлық ұлы ғалым кім?', 'Әл-Фараби', ['Ибн Сина','Ясауи','Қашқари']],
      ['Отырарды 1219–1220 жылдары кімнің әскері қоршады?', 'Шыңғыс хан', ['Әмір Темір','Ескендір','Жоңғарлар']],
      ['Отырар қай өзеннің бойында орналасқан?', 'Сырдария', ['Жайық','Іле','Ертіс']],
      ['Моңғолдарға қарсы тұрған Отырар билеушісі кім?', 'Қайыр хан', ['Абылай хан','Тәуке хан','Қасым хан']],
      ['Отырар бүгінде қай облыста?', 'Түркістан', ['Жамбыл','Қызылорда','Алматы']],
    ]},
  { city:'Түркістан', pos:[125,265], fact:'Түркістан — қазақ халқының рухани орталығы, Қазақ хандығының астанасы болған қала. Мұнда Әмір Темір салдырған Қожа Ахмет Ясауи кесенесі тұр.',
    qs:[
      ['Түркістандағы атақты кесене кімге арналған?', 'Қожа Ахмет Ясауи', ['Әл-Фараби','Айша бибі','Қарахан']],
      ['Ясауи кесенесін кім салдырды?', 'Әмір Темір', ['Шыңғыс хан','Абылай хан','Керей хан']],
      ['Қожа Ахмет Ясауидің атақты кітабы қалай аталады?', '«Диуани хикмет»', ['«Құтадғу біліг»','«Қобыланды»','«Қозы Көрпеш»']],
      ['Ясауи кесенесі ЮНЕСКО тізіміне қай жылы енді?', '2003', ['1991','1997','2010']],
      ['Абылай хан қай қалада жерленген?', 'Түркістан', ['Тараз','Отырар','Сарайшық']],
    ]},
  { city:'Алматы', pos:[265,282], fact:'Алматы — Іле Алатауының етегіндегі әсем қала. Бұрын Верный деп аталған. 1997 жылға дейін Қазақстанның астанасы болды. 1986 жылғы Желтоқсан көтерілісі осы қалада өтті.',
    qs:[
      ['Алматының бұрынғы атауы қандай?', 'Верный', ['Әулиеата','Ақмешіт','Ақмола']],
      ['Алматы қай жылға дейін Қазақстанның астанасы болды?', '1997', ['1991','1986','2000']],
      ['1986 жылы Алматыда қандай тарихи оқиға болды?', 'Желтоқсан көтерілісі', ['Ақтабан шұбырынды','Аңырақай шайқасы','Отырар қорғанысы']],
      ['Алматы маңындағы атақты биік таулы мұз айдыны қалай аталады?', 'Медеу', ['Көктөбе','Бурабай','Байқоңыр']],
      ['Алматы қай таудың етегінде орналасқан?', 'Іле Алатауы', ['Алтай','Қаратау','Ұлытау']],
    ]},
  { city:'Астана', pos:[190,105], fact:'Астана — Есіл өзенінің бойындағы еліміздің бас қаласы. 1997 жылдан бері елорда. Қаланың символы — биіктігі 97 метр Бәйтерек мұнарасы.',
    qs:[
      ['Елорда Астанаға қай жылы көшті?', '1997', ['1991','2000','1995']],
      ['Астананың бұрынғы атауы қайсысы?', 'Ақмола', ['Верный','Әулиеата','Ақмешіт']],
      ['2019–2022 жылдары Астана қалай аталды?', 'Нұр-Сұлтан', ['Ақмола','Целиноград','Есіл']],
      ['Астана қай өзеннің бойында орналасқан?', 'Есіл', ['Сырдария','Іле','Жайық']],
      ['Астананың символы болып табылатын 97 метрлік мұнара қалай аталады?', 'Бәйтерек', ['Хан Шатыр','Ақорда','Нұр Әлем']],
    ]},
];
// Google Sheets веб-қосымшасының сілтемесі (Apps Script)
const SCRIPT_URL = '';

const PRAISE = ['Бәрекелді, батыр!','Дұрыс! Жарайсың!','Керемет!','Тамаша білім!','Нағыз шежіреші!'];

/* ---------- state ---------- */
let save = { done:0, coins:0, stars:[], name:'', id:'', correct:0, answered:0 };
try { const s = JSON.parse(localStorage.getItem('ulydala')); if (s && typeof s.done === 'number') save = Object.assign(save, s); } catch(e){}
function persist(){ try { localStorage.setItem('ulydala', JSON.stringify(save)); } catch(e){} }

let lvl, qi, lives, lvlCoins, order, locked, results;

/* ---------- results to Google Sheets ---------- */
function report(){
  if (!SCRIPT_URL || !save.name) return;
  const reached = save.done >= LEVELS.length ? 'Бәрін бітірді 🏆' : save.done > 0 ? LEVELS[save.done - 1].city : 'Әлі өтпеді';
  const data = { id:save.id, name:save.name, city:reached, correct:save.correct, total:save.answered, coins:save.coins, finished:save.done >= LEVELS.length };
  try { fetch(SCRIPT_URL, { method:'POST', mode:'no-cors', body:JSON.stringify(data) }).catch(()=>{}); } catch(e){}
}

/* ---------- helpers ---------- */
const $ = id => document.getElementById(id);
function show(id){ document.querySelectorAll('.screen').forEach(s => s.classList.toggle('on', s.id === id)); window.scrollTo(0,0); }
function shuffle(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function shields(n){ let h=''; for(let i=0;i<3;i++) h += `<svg width="20" height="22" viewBox="0 0 20 22" style="margin-right:4px;vertical-align:-4px"><path d="M10 1 L18 4 V10 C18 16 14 19 10 21 C6 19 2 16 2 10 V4 Z" fill="${i<n?'#EF9F27':'none'}" stroke="#EF9F27" stroke-width="1.8"/></svg>`; return h; }

function ornament(svg){
  svg.setAttribute('viewBox','0 0 320 22'); svg.setAttribute('preserveAspectRatio','xMidYMid slice');
  let g = '<line x1="0" y1="11" x2="320" y2="11" stroke="#BA7517" stroke-width="1"/>';
  for (let x=20; x<320; x+=40) {
    g += `<g fill="none" stroke="#EF9F27" stroke-width="1.8" stroke-linecap="round">
      <path d="M${x} 11 c0-7 -9-9 -10-3 c-1 4 4 5 5 2"/><path d="M${x} 11 c0-7 9-9 10-3 c1 4 -4 5 -5 2"/>
      <path d="M${x} 11 c0 7 -9 9 -10 3 c-1-4 4-5 5-2"/><path d="M${x} 11 c0 7 9 9 10 3 c1-4 -4-5 -5-2"/></g>
      <circle cx="${x+20}" cy="11" r="2" fill="#FAC775"/>`;
  }
  svg.innerHTML = g;
}
document.querySelectorAll('[data-orn]').forEach(ornament);

/* ---------- sound ---------- */
let actx;
function tones(list, type='triangle'){
  try {
    actx = actx || new (window.AudioContext||window.webkitAudioContext)();
    list.forEach(([f,t,d]) => {
      const o=actx.createOscillator(), g=actx.createGain(), s=actx.currentTime+t;
      o.type=type; o.frequency.value=f;
      g.gain.setValueAtTime(.0001,s); g.gain.exponentialRampToValueAtTime(.2,s+.02); g.gain.exponentialRampToValueAtTime(.0001,s+d);
      o.connect(g).connect(actx.destination); o.start(s); o.stop(s+d+.05);
    });
  } catch(e){}
}
const sOk  = () => tones([[523,0,.18],[659,.1,.18],[784,.2,.3]]);
const sBad = () => tones([[233,0,.25],[196,.15,.35]], 'sawtooth');
const sWin = () => tones([[392,0,.2],[523,.15,.2],[659,.3,.2],[784,.45,.5],[659,.7,.2],[784,.85,.6]]);

/* ---------- map ---------- */
function drawMap(){
  const m = $('map');
  let h = `
  <defs><pattern id="grass" width="26" height="22" patternUnits="userSpaceOnUse">
    <path d="M4 18 l2-5 l2 5 M15 9 l2-4 l2 4" stroke="#d9c39a" stroke-width="1.2" fill="none"/></pattern></defs>
  <rect x="0" y="0" width="340" height="420" rx="14" fill="#FAEEDA"/>
  <rect x="0" y="0" width="340" height="420" rx="14" fill="url(#grass)"/>
  <rect x="8" y="8" width="324" height="404" rx="10" fill="none" stroke="#BA7517" stroke-width="2" stroke-dasharray="2 5"/>
  <path d="M20 300 C50 320 40 360 85 370 S130 395 150 410" fill="none" stroke="#85B7EB" stroke-width="4" stroke-linecap="round"/>
  <text x="18" y="290" font-size="10" fill="#185FA5" font-style="italic">Сырдария</text>
  <path d="M120 70 C150 90 170 80 200 95 S250 120 290 110" fill="none" stroke="#85B7EB" stroke-width="3.5" stroke-linecap="round"/>
  <text x="255" y="100" font-size="10" fill="#185FA5" font-style="italic">Есіл</text>
  <g fill="#c9a874" stroke="#854F0B" stroke-width="1.2" transform="translate(0,22)">
    <path d="M225 370 l18-34 l18 34 Z"/><path d="M250 372 l22-44 l22 44 Z"/><path d="M282 372 l16-30 l16 30 Z"/>
  </g>
  <g fill="#fff" transform="translate(0,22)"><path d="M266 340 l6-12 l6 12 Z" opacity=".9"/></g>
  <g fill="none" stroke="#854F0B" stroke-width="1.3">
    <path d="M40 190 q12-14 24 0 v8 h-24 Z"/><path d="M52 176 v4"/>
    <path d="M260 210 q12-14 24 0 v8 h-24 Z"/><path d="M272 196 v4"/>
    <path d="M100 150 q10-12 20 0 v7 h-20 Z"/>
  </g>
  <g transform="translate(298,48)">
    <circle r="20" fill="none" stroke="#BA7517" stroke-width="1.5"/>
    <path d="M0 -18 L5 0 L0 18 L-5 0 Z" fill="#854F0B"/>
    <text y="-24" text-anchor="middle" font-size="10" fill="#633806" font-weight="700">С</text>
  </g>`;
  const p = LEVELS.map(l => l.pos);
  const route = `M${p[0]} C95 320 105 290 ${p[1]} S240 260 ${p[2]} S240 160 ${p[3]}`;
  h += `<path d="${route}" fill="none" stroke="#c9a874" stroke-width="5" stroke-dasharray="9 7" stroke-linecap="round"/>`;
  LEVELS.forEach((l,i) => {
    const [x,y] = l.pos, st = i < save.done ? 'done' : i === save.done ? 'cur' : 'locked';
    const fill = st==='done' ? '#639922' : st==='cur' ? '#EF9F27' : '#D3D1C7';
    const stroke = st==='done' ? '#27500A' : st==='cur' ? '#854F0B' : '#888780';
    const inner = st==='done' ? `<path d="M${x-7} ${y} l5 5 l9-10" stroke="#fff" stroke-width="3" fill="none" stroke-linecap="round"/>`
      : st==='locked' ? `<rect x="${x-6}" y="${y-2}" width="12" height="9" rx="2" fill="#5F5E5A"/><path d="M${x-4} ${y-2} v-3 a4 4 0 0 1 8 0 v3" stroke="#5F5E5A" stroke-width="2" fill="none"/>`
      : `<text x="${x}" y="${y+6}" text-anchor="middle" font-size="17" font-weight="700" fill="#412402" font-family="PT Serif, serif">${i+1}</text>`;
    const stars = save.stars[i] ? `<text x="${x}" y="${y-28}" text-anchor="middle" font-size="13" fill="#BA7517">${'★'.repeat(save.stars[i])}${'☆'.repeat(3-save.stars[i])}</text>` : '';
    h += `<g class="node ${st}" data-i="${i}">
      ${st==='cur' ? `<circle class="ring" cx="${x}" cy="${y}" r="20" fill="none" stroke="#EF9F27" stroke-width="3"/>` : ''}
      <circle cx="${x}" cy="${y}" r="26" fill="transparent"/>
      <circle cx="${x}" cy="${y}" r="19" fill="${fill}" stroke="${stroke}" stroke-width="2.5"/>
      ${inner}${stars}
      <rect x="${x-44}" y="${y+24}" width="88" height="20" rx="10" fill="#412402" opacity="${st==='locked'?.55:1}"/>
      <text x="${x}" y="${y+38}" text-anchor="middle" font-size="13" fill="#FAC775" font-family="PT Serif, serif" font-weight="700">${l.city}</text>
    </g>`;
  });
  m.innerHTML = h;
  m.querySelectorAll('.node').forEach(n => n.addEventListener('click', () => {
    const i = +n.dataset.i;
    if (i > save.done) { $('m-hint').textContent = 'Алдымен алдыңғы қаладан өт!'; tones([[300,0,.15]]); return; }
    openIntro(i);
  }));
  $('m-coins').textContent = save.coins;
  $('m-hint').textContent = save.done < LEVELS.length ? `Келесі аялдама: ${LEVELS[save.done].city}. Қаланы бас!` : 'Барлық қала ашылды!';
}

/* ---------- level flow ---------- */
function openIntro(i){
  lvl = i;
  $('i-level').textContent = `${i+1}-деңгей`;
  $('i-city').textContent = LEVELS[i].city;
  $('i-fact').textContent = LEVELS[i].fact;
  show('s-intro');
}
function startLevel(){
  qi = 0; lives = 3; lvlCoins = 0; results = [];
  order = shuffle(LEVELS[lvl].qs);
  show('s-quiz'); renderQ();
}
function renderQ(){
  locked = false;
  const [q, a, wrong] = order[qi];
  $('q-lives').innerHTML = shields(lives);
  $('q-coins').textContent = save.coins + lvlCoins;
  $('q-city').textContent = `${LEVELS[lvl].city} · ${qi+1}-сұрақ`;
  $('q-text').textContent = q;
  $('q-msg').textContent = '';
  $('q-dots').innerHTML = order.map((_,k) => `<span class="dot ${k<qi ? results[k] : k===qi ? 'now' : ''}"></span>`).join('');
  const box = $('q-opts'); box.innerHTML = '';
  shuffle([a, ...wrong]).forEach((t,k) => {
    const b = document.createElement('button');
    b.className = 'opt'; b.innerHTML = `<b>${'АБВГ'[k]}</b><span></span>`;
    b.querySelector('span').textContent = t; b.dataset.v = t;
    b.onclick = () => pick(b, t, a);
    box.appendChild(b);
  });
}
function pick(btn, t, a){
  if (locked) return; locked = true;
  const msg = $('q-msg');
  save.answered++;
  if (t === a) {
    btn.classList.add('ok'); sOk(); lvlCoins += 20; results[qi] = 'ok'; save.correct++;
    msg.style.color = '#97C459'; msg.textContent = PRAISE[Math.floor(Math.random()*PRAISE.length)];
  } else {
    btn.classList.add('bad'); sBad(); lives--; results[qi] = 'bad';
    document.querySelectorAll('.opt').forEach(b => { if (b.dataset.v === a) b.classList.add('ok'); });
    msg.style.color = '#f09595'; msg.textContent = 'Дұрыс жауабы: ' + a;
  }
  $('q-lives').innerHTML = shields(lives);
  $('q-coins').textContent = save.coins + lvlCoins;
  setTimeout(() => {
    if (lives <= 0) return levelFail();
    qi++;
    qi < order.length ? renderQ() : levelWin();
  }, t === a ? 1100 : 2000);
}
function levelWin(){
  const correct = results.filter(r => r === 'ok').length;
  const stars = correct === 5 ? 3 : correct >= 4 ? 2 : 1;
  save.coins += lvlCoins;
  save.stars[lvl] = Math.max(save.stars[lvl] || 0, stars);
  const first = lvl === save.done;
  if (first) save.done++;
  persist(); report(); sWin();
  if (save.done >= LEVELS.length && first) return showFinal();
  $('r-title').textContent = `${LEVELS[lvl].city} бағындырылды!`;
  $('r-stars').textContent = '★'.repeat(stars) + '☆'.repeat(3-stars);
  $('r-text').textContent = `5 сұрақтың ${correct}-іне дұрыс жауап бердің, +${lvlCoins} тиын.` + (first && save.done < LEVELS.length ? ` ${LEVELS[save.done].city} жолы ашылды!` : '');
  $('r-btn').textContent = 'Картаға';
  $('r-btn').onclick = () => { drawMap(); show('s-map'); };
  show('s-result');
}
function levelFail(){
  persist(); report();
  $('r-title').textContent = 'Қалқандар бітті';
  $('r-stars').textContent = '';
  $('r-text').textContent = `Батыр жеңілгенде берілмейді! ${LEVELS[lvl].city} сынағын қайта байқап көр.`;
  $('r-btn').textContent = 'Қайта көру';
  $('r-btn').onclick = startLevel;
  show('s-result');
}
function showFinal(){
  const total = save.stars.reduce((s,x) => s + (x||0), 0);
  const n = total >= 11 ? 3 : total >= 8 ? 2 : 1;
  $('f-stars').textContent = '★'.repeat(n) + '☆'.repeat(3-n);
  $('f-coins').textContent = `Жиналған тиын: ${save.coins}`;
  $('f-name').textContent = save.name;
  show('s-final');
}

/* ---------- buttons ---------- */
$('name').value = save.name || '';
$('name').addEventListener('input', () => { $('name-err').textContent = ''; });
$('b-start').onclick = () => {
  const n = $('name').value.trim().replace(/\s+/g,' ');
  if (n.length < 2) { $('name-err').textContent = 'Алдымен атыңды жаз'; $('name').focus(); return; }
  if (n !== save.name) {
    save = { done:0, coins:0, stars:[], name:n, id: Date.now().toString(36) + Math.random().toString(36).slice(2,8), correct:0, answered:0 };
  }
  persist(); report();
  if (save.done >= LEVELS.length) return showFinal();
  drawMap(); show('s-map');
};
$('b-go').onclick = startLevel;
$('b-back').onclick = () => { drawMap(); show('s-map'); };
$('b-restart').onclick = () => { save = { done:0, coins:0, stars:[], name:save.name, id:save.id, correct:0, answered:0 }; persist(); report(); drawMap(); show('s-map'); };
</script>
</body>
</html>
